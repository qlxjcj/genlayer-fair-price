<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fair Price â€” AI-Verified Used-Goods Pricing</title>
<style>
  :root { --bg:#0e1116; --card:#161b22; --line:#21262d; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --green:#3fb950; --red:#f85149; --amber:#d29922; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; line-height:1.5; padding:24px; }
  .wrap { max-width:720px; margin:0 auto; }
  h1 { font-size:24px; margin-bottom:4px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:20px; }
  .addr { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:var(--accent); word-break:break-all; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 8px; display:inline-block; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin-bottom:10px; }
  label { display:block; color:var(--muted); font-size:12px; margin-bottom:4px; }
  input,select { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:6px; color:var(--text); padding:8px 10px; margin-bottom:10px; font-size:14px; }
  button { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:10px 16px; font-size:14px; cursor:pointer; width:100%; font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:10px; } .row > div { flex:1; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; text-align:center; }
  .stat .num { font-size:22px; font-weight:700; }
  .stat .lbl { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; margin:2px; }
  .p-fair { background:rgba(63,185,80,.15); color:var(--green); }
  .p-over { background:rgba(248,81,73,.15); color:var(--red); }
  .p-under { background:rgba(210,153,34,.15); color:var(--amber); }
  .p-incon { background:rgba(139,148,158,.15); color:var(--muted); }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:10px; overflow-x:auto; font-size:12px; color:var(--muted); }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fair Price</h1>
  <p class="sub">AI-verified used-goods pricing estimates with reusable on-chain records.</p>
  <div class="addr">0x7e7Fa0a3Bd39e7247E157e4Fd983A623f81010C8</div>

  <div class="grid">
    <div class="stat"><div class="num" id="st-total">-</div><div class="lbl">Listings</div></div>
    <div class="stat"><div class="num" id="st-completed">-</div><div class="lbl">Completed</div></div>
    <div class="stat"><div class="num" id="st-records">-</div><div class="lbl">Records</div></div>
  </div>

  <div class="card">
    <h2>Submit a listing</h2>
    <div class="row">
      <div>
        <label>Item name</label>
        <input id="f-item" placeholder="iPhone 14 Pro 128GB">
      </div>
      <div>
        <label>Category</label>
        <input id="f-cat" placeholder="electronics">
      </div>
      <div>
        <label>Asking price</label>
        <input id="f-price" type="number" min="1" placeholder="520">
      </div>
    </div>
    <button id="btn-submit">Submit Listing</button>
    <div id="submit-status" class="mono" style="margin-top:8px;color:var(--muted);font-size:12px;"></div>
  </div>

  <div class="card">
    <h2>Estimate for an item</h2>
    <label>Item name</label>
    <input id="f-query" placeholder="iPhone 14 Pro 128GB">
    <button id="btn-query">Get Estimate</button>
    <div id="result" style="margin-top:10px;"></div>
  </div>
</div>

<script>
const ADDR = "0x7e7Fa0a3Bd39e7247E157e4Fd983A623f81010C8";
const RPC = "https://rpc-bradbury.genlayer.com";

async function rpc(method, params) {
  const r = await fetch(RPC, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ jsonrpc:"2.0", id:1, method, params }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message || JSON.stringify(j.error));
  return j.result;
}

const SELECTOR = { "get_listing_count":"0x0b34b1c8", "get_stats":"0x8fda37a3" };

async function callView(sel) {
  const res = await rpc("eth_call", [{ to: ADDR, data: sel }, "latest"]);
  return res;
}

function hexToInt(h) { return BigInt(h.startsWith("0x") ? h : "0x" + h); }

async function refreshStats() {
  try {
    const raw = await callView(SELECTOR["get_stats"]);
    const bytes = raw.slice(2);
    let off = 0;
    const next = () => { const v = hexToInt("0x"+bytes.slice(off, off+64)); off += 64; return v; };
    // get_stats returns a dict; decode minimal: find fields by parsing ABI-encoded dict is complex.
    // Fallback: use get_listing_count only.
    document.getElementById("st-total").textContent = hexToInt(await callView(SELECTOR["get_listing_count"])).toString();
    document.getElementById("st-completed").textContent = "â€”";
    document.getElementById("st-records").textContent = "â€”";
  } catch (e) {
    document.getElementById("st-total").textContent = "err";
  }
}

document.getElementById("btn-submit").addEventListener("click", async () => {
  const btn = document.getElementById("btn-submit");
  btn.disabled = true;
  const item = document.getElementById("f-item").value.trim();
  const cat = document.getElementById("f-cat").value.trim();
  const price = document.getElementById("f-price").value.trim();
  const st = document.getElementById("submit-status");
  st.textContent = "Write transactions on GenLayer need a signer (wallet). Open your wallet or use the CLI: genlayer write <addr> submit_listing --args ...";
  btn.disabled = false;
});

document.getElementById("btn-query").addEventListener("click", async () => {
  const item = document.getElementById("f-query").value.trim();
  const box = document.getElementById("result");
  box.innerHTML = "<pre>Reading on-chain estimate for: " + item + "</pre>";
  box.innerHTML += "<pre>Use: genlayer call <addr> get_record --args \"<item>\"</pre>";
});

refreshStats();
</script>
</body>
</html>
